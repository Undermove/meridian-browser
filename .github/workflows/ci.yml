name: CI

# Fast checks on every PR and push to main, the ones the "main: checks must pass" ruleset requires
# (so Dependabot auto-merge waits for them): the MCP bridge starts and answers, and the Workbench
# page assembles with its pinned Monaco and xterm.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: initialize, tools/list, tools/call
        env:
          MERIDIAN_DATA_DIR: ${{ runner.temp }}/meridian-data
        run: node .github/scripts/mcp-smoke.mjs node mcp/meridian-mcp.js

  workbench-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - name: Assemble the Workbench page
        env:
          MERIDIAN_VENDOR_CACHE: ${{ runner.temp }}/vendor
        run: |
          out="$RUNNER_TEMP/workbench"
          chromium/tools/workbench_assets.sh "$out"
          for f in vendor/monaco/vs/loader.js vendor/monaco/vs/editor/editor.main.js vendor/xterm/lib/xterm.js vendor/xterm-fit/lib/addon-fit.js workbench.html bridge.js; do
            test -s "$out/$f" || { echo "missing: $f"; exit 1; }
          done
          for f in "$out"/*.js; do node --check "$f"; done
