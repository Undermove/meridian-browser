name: ClusterFuzzLite (PR)

# Fuzzes a pull request's change for 5 minutes: the Jazzer.js targets in fuzz/ (MCP bridge, tool
# arguments, Mission Control hook, secret detection, terminal image paths). Code-change mode runs
# only the targets whose code the change touches, starting from the corpus the daily batch run
# keeps (cflite-batch.yml). A crash fails the job and is uploaded as an artifact.

on:
  pull_request:
    paths:
      - 'mcp/**'
      - 'src/**'
      - 'fuzz/**'
      - '.clusterfuzzlite/**'
      - 'package-lock.json'
      - '.github/workflows/cflite-pr.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # the batch run's corpus, kept as an Actions artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # language/sanitizer: the actions can't fuzz JavaScript as such. They accept only address, memory,
      # undefined or coverage, OSS-Fuzz's compile takes only none or coverage for javascript, and
      # coverage makes run_fuzzers write a coverage report instead of fuzzing. So the actions are told
      # c++ + address: compile then just runs .clusterfuzzlite/build.sh, which produces Jazzer.js
      # wrappers (project.yaml still says javascript). The bad-build check looks for ASan
      # instrumentation in binaries, which shell wrappers don't have, so it is off.
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c++
          sanitizer: address
          bad-build-check: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: address
