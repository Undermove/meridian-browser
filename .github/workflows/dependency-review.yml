name: Dependency review

# Every PR: the dependencies it adds or changes (npm lockfiles, GitHub Actions, Docker images), from
# GitHub's dependency graph. Fails on a new dependency with a known vulnerability of moderate
# severity or worse, or with a license outside the allow-list below, and comments the summary on
# the PR. Required by the "main: checks must pass" ruleset, so it runs on every PR (no paths filter).
#
# Licenses: an allow-list, not a deny-list, so an unusual copyleft or non-commercial license
# (GPL, AGPL, LGPL, SSPL, EUPL, CC-BY-NC ...) fails instead of slipping through. It is what
# THIRD_PARTY_NOTICES.md already ships (MIT, ISC, BSD-2/3-Clause, Apache-2.0, MPL-2.0, Unlicense)
# plus the other permissive licenses common on npm. MPL-2.0 is file-level copyleft: fine for
# unmodified packages we ship as they are (the Ghostery adblocker). GPL/AGPL/LGPL are left out: the
# app ships as one signed bundle with no way for a user to relink, which LGPL asks for. Chromium
# itself (BSD-3-Clause) is not a package dependency here; its notices ship as LICENSES.chromium.html.
# A dependency without a detectable license is reported but doesn't fail.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # the summary comment; on fork PRs it is read-only and the action only warns
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, unknown
          allow-licenses: >-
            MIT, MIT-0, ISC, BSD-2-Clause, BSD-3-Clause, 0BSD, Apache-2.0, MPL-2.0, Unlicense,
            CC0-1.0, CC-BY-3.0, CC-BY-4.0, BlueOak-1.0.0, Zlib, Python-2.0, BSL-1.0
          comment-summary-in-pr: on-failure
          show-patched-versions: true
