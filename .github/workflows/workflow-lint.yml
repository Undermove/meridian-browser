name: Workflow lint

# The GitHub Actions workflows themselves, on every PR, push to main and weekly (zizmor's online
# audits learn about newly vulnerable actions without a change here):
# - zizmor: security (excessive permissions, template injection, unpinned actions, credentials
#   left in .git/config, dangerous triggers). Findings go to code scanning; the job fails on any
#   finding of medium severity or worse. An accepted finding gets an inline
#   "# zizmor: ignore[rule]" with the reason.
# - actionlint: correctness (expression and type errors, unknown inputs, shellcheck on run: blocks).
# zizmor is required by the "main: checks must pass" ruleset, so neither job has a paths filter.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '13 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor (to code scanning)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: true
      - name: zizmor (fail on medium or worse)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false
          annotations: true
          min-severity: medium

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (checksum-pinned)
        run: |
          tgz="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tgz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tgz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        # shellcheck (preinstalled on the runner) checks every run: block too. Each error is an
        # annotation on its line; any error fails the job.
        run: |
          # shellcheck disable=SC2016 # actionlint's Go template, not a shell expression
          "$RUNNER_TEMP/actionlint" -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}\n{{end}}'
