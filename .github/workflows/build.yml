name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist: dist:mac
          - os: windows-latest
            dist: dist:win
          - os: ubuntu-latest
            dist: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Smoke test: launch the real app, let it render, take a screenshot, exit.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          MERIDIAN_USER_DATA=$RUNNER_TEMP/ud MERIDIAN_SHOT=smoke.png MERIDIAN_STEPS='[{"wait":4000}]' \
            ELECTRON_DISABLE_SANDBOX=1 xvfb-run -a npx electron . --no-sandbox
      - name: Smoke test (macOS / Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: MERIDIAN_USER_DATA="$RUNNER_TEMP/ud" MERIDIAN_SHOT=smoke.png MERIDIAN_STEPS='[{"wait":4000}]' npx electron .
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ runner.os }}
          path: smoke.png

      - run: npm run ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: meridian-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore
