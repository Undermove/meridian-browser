name: Build

# Every push and PR: build Meridian for macOS, Windows and Linux and smoke-test it.
# A tag like v0.1.0: the same builds, then a GitHub Release with all installers attached.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            dist: scripts/build-mac-release.sh
          - name: Windows
            os: windows-latest
            dist: npx electron-builder --win --publish never
          - name: Linux-x64
            os: ubuntu-latest
            dist: npx electron-builder --linux --x64 --publish never
          # node-pty has no Linux prebuilds, so arm64 is compiled on a native arm64 runner.
          - name: Linux-arm64
            os: ubuntu-24.04-arm
            dist: npx electron-builder --linux --arm64 --publish never
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Smoke test: launch the real app, let it render, take a screenshot, exit.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          MERIDIAN_USER_DATA=$RUNNER_TEMP/ud MERIDIAN_SHOT=smoke.png MERIDIAN_STEPS='[{"wait":4000}]' \
            ELECTRON_DISABLE_SANDBOX=1 timeout 180 xvfb-run -a npx electron . --no-sandbox --disable-gpu
      - name: Smoke test (macOS / Windows)
        if: runner.os != 'Linux'
        timeout-minutes: 5
        shell: bash
        run: MERIDIAN_USER_DATA="$RUNNER_TEMP/ud" MERIDIAN_SHOT=smoke.png MERIDIAN_STEPS='[{"wait":4000}]' npx electron .
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.name }}
          path: smoke.png

      - run: npm run build:mcp
      - run: ${{ matrix.dist }}
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
      - run: node scripts/check-guard-hook.js
      - uses: actions/upload-artifact@v4
        with:
          name: meridian-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: meridian-*
          path: out
          merge-multiple: true
      # Version-less copies give the site stable links: releases/latest/download/Meridian-win.exe
      - name: Stable download names
        run: |
          cd out
          for f in Meridian-*-win.exe Meridian-*-mac-arm64.dmg Meridian-*-mac-x64.dmg Meridian-*-linux-amd64.deb Meridian-*-linux-arm64.deb Meridian-*-linux-x86_64.AppImage; do
            cp "$f" "Meridian-${f#Meridian-*-}"
          done
          ls -l
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Meridian ${GITHUB_REF_NAME#v}" \
            --generate-notes
