name: Dependency scan

# Every lockfile in the repository, with all transitive dependencies, against OSV
# (osv.dev: GitHub advisories, npm, Debian and more). Findings go to code scanning.
# On PRs, npm audit also fails on a high or critical advisory in a runtime dependency.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      scan-args: |-
        -r
        ./
      fail-on-vuln: false

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: npm audit (runtime dependencies, high and critical)
        run: |
          status=0
          for lock in $(git ls-files '*package-lock.json'); do
            dir="$(dirname "$lock")"
            echo "::group::$dir"
            (cd "$dir" && npm audit --omit=dev --audit-level=high) || status=1
            echo "::endgroup::"
          done
          exit $status
