name: ClusterFuzzLite (daily)

# Fuzzes every target in fuzz/ for half an hour a day and keeps the grown corpus as an Actions
# artifact, which the PR runs (cflite-pr.yml) start from. A crash fails the run and is uploaded as
# an artifact; reproduce it with `npx --prefix fuzz jazzer fuzz/<target>.fuzz.js <crash file>`.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # the corpus of the previous run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # language/sanitizer: the actions can't fuzz JavaScript as such. They accept only address, memory,
      # undefined or coverage, OSS-Fuzz's compile takes only none or coverage for javascript, and
      # coverage makes run_fuzzers write a coverage report instead of fuzzing. So the actions are told
      # c++ + address: compile then just runs .clusterfuzzlite/build.sh, which produces Jazzer.js
      # wrappers (project.yaml still says javascript). The bad-build check looks for ASan
      # instrumentation in binaries, which shell wrappers don't have, so it is off.
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c++
          sanitizer: address
          bad-build-check: false
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 1800
          mode: batch
          sanitizer: address
