name: Security digest

# Weekly: one pinned issue, "Security digest", updated in place, with the open Dependabot, code
# scanning and secret scanning alerts, the Dependabot PRs waiting for a person and the Chromium
# update issue. The default token can't read Dependabot or secret scanning alerts. Add a
# SECURITY_DIGEST_TOKEN secret (fine-grained, this repository, read-only: Dependabot alerts, Code
# scanning alerts, Secret scanning alerts) to include them.

on:
  schedule:
    - cron: '7 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the digest
        env:
          GH_TOKEN: ${{ github.token }}
          ALERTS_TOKEN: ${{ secrets.SECURITY_DIGEST_TOKEN || github.token }}
        run: .github/scripts/security-digest.sh
