name: Chromium update

# Runs chromium/update_chromium.sh on the self-hosted Mac (label meridian-builder) that holds the
# Chromium checkout and the "Meridian Signing" certificate: newest Chromium of the branch, build,
# tests, signed packages, a draft release. Started by "Chromium watch" (AUTO_UPDATE=true) or by hand.
# Register the runner once: Settings → Actions → Runners → New self-hosted runner (macOS, ARM64),
# with the extra label meridian-builder, and keep the Mac awake and unlocked while it builds.

on:
  workflow_dispatch:
    inputs:
      args:
        description: 'update_chromium.sh options, e.g. --branch 8160'
        required: false
        default: ''

permissions:
  contents: write

concurrency: chromium-update

jobs:
  update:
    runs-on: [self-hosted, macOS, meridian-builder]
    timeout-minutes: 600
    steps:
      - name: Update, build, test, package, draft
        env:
          GH_TOKEN: ${{ github.token }}
        # In the Meridian checkout the runner works for (not the runner's own workspace copy), so
        # out/ and the patches stay where the builds live.
        run: |
          cd "${MERIDIAN_REPO:-$HOME/repos/meridian-wt-chromium}"
          git pull -q --ff-only
          chromium/update_chromium.sh ${{ inputs.args }}
