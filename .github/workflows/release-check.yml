name: Release check

# Every published release, on a clean Mac: install it the way people do (install.sh), check the
# checksum and the signature and that the in-app updater takes it; if any of that fails, the release
# goes back to pre-release (so nobody is offered a release that can't install) and an issue opens.
# Then the E2E suite against the installed app: it reports (an issue) but doesn't change the release,
# since a shared CI Mac can't run all of it (no display, no keychain, network) and it failed there on
# every release, putting good releases back to pre-release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.5.1'
        required: true
      tests:
        description: 'Test files to run (default: all)'
        required: false
        default: '*.test.mjs'

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A release: its own tag. By hand: the tests of the branch it's run from, against that release.
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install with install.sh
        run: |
          mkdir -p "$RUNNER_TEMP/apps" "$RUNNER_TEMP/curl"
          # Signed-in API calls: anonymous ones from shared runner addresses hit the rate limit (403).
          # curl keeps this header to api.github.com, not the asset hosts it's redirected to.
          printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" > "$RUNNER_TEMP/curl/.curlrc"
          export CURL_HOME="$RUNNER_TEMP/curl"
          MERIDIAN_RELEASE_API="https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
            MERIDIAN_INSTALL_DIR="$RUNNER_TEMP/apps" MERIDIAN_NO_OPEN=1 bash docs/install.sh
          codesign --verify --deep --strict "$RUNNER_TEMP/apps/Meridian.app"
          codesign -d -r- "$RUNNER_TEMP/apps/Meridian.app" 2>&1 | grep -q 'certificate root = H"3c14fc1c2294761dfa79fdb55d0dd53cb819186b"' \
            || { echo "Not signed with Meridian Signing"; exit 1; }
      - name: The Mac updater takes this release
        run: |
          # What the in-app updater checks: SHA256SUMS.txt signed with the release key, listing the
          # Mac zip. install.sh checks the checksum but not that signature.
          mkdir -p "$RUNNER_TEMP/rel"
          gh release download "$TAG" -R "${{ github.repository }}" -D "$RUNNER_TEMP/rel" -p 'SHA256SUMS.txt*' -p 'Meridian-*-mac-arm64.zip'
          node chromium/tools/verify_release.mjs "$RUNNER_TEMP/rel/SHA256SUMS.txt" "$RUNNER_TEMP/rel/SHA256SUMS.txt.sig" "$RUNNER_TEMP"/rel/Meridian-*-mac-arm64.zip
      - name: Take the release back to pre-release
        if: failure()
        run: |
          gh release edit "$TAG" --prerelease
          gh issue create --title "Release check failed for $TAG" \
            --body "It doesn't install, isn't signed, or the updater won't take it: the release was set back to pre-release. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: E2E tests against the installed app
        id: e2e
        continue-on-error: true
        env:
          E2E_FAILED: ${{ runner.temp }}/e2e-failed.txt
        run: |
          cd chromium/tests
          MERIDIAN_APP="$RUNNER_TEMP/apps/Meridian.app/Contents/MacOS/Meridian" \
            node ../tools/ci_e2e.mjs ${{ inputs.tests || '*.test.mjs' }}
      # One issue for the shared CI Mac, not one per release: each release adds what still failed
      # after a second try. The release stays as it is.
      - name: Report E2E failures
        if: steps.e2e.outcome == 'failure'
        run: |
          TITLE="E2E on the shared CI Mac"
          {
            echo "**$TAG** installs and updates (it stays published). Still failing after a second try on the CI Mac, which has no display or keychain: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            sed -e 's/^/- /' "$RUNNER_TEMP/e2e-failed.txt" 2>/dev/null | head -40
          } > "$RUNNER_TEMP/e2e-report.md"
          N=$(gh issue list -R "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\"))[0].number // empty")
          if [ -n "$N" ]; then
            gh issue comment "$N" -R "${{ github.repository }}" --body-file "$RUNNER_TEMP/e2e-report.md"
          else
            gh issue create -R "${{ github.repository }}" --title "$TITLE" --body-file "$RUNNER_TEMP/e2e-report.md"
          fi
