name: Chromium checks

# Quick checks on every push and PR touching the Chromium port: the scripts parse and pass
# shellcheck, the test files load, the Chromium watcher's logic holds, and every patch is a
# well-formed git patch numbered in order.

on:
  push:
    paths: ['chromium/**', 'docs/install.sh', '.github/workflows/chromium-*.yml', '.github/workflows/release-check.yml']
  pull_request:
    paths: ['chromium/**', 'docs/install.sh']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shell scripts
        run: |
          for f in docs/install.sh chromium/*.sh chromium/tools/*.sh chromium/tests/run.sh; do bash -n "$f"; done
          shellcheck -S error docs/install.sh chromium/*.sh chromium/tools/*.sh chromium/tests/run.sh
      - name: Test files load
        run: for f in chromium/tests/*.mjs; do node --check "$f"; done
      - name: Chromium watcher
        run: node --test chromium/tools/chromium_watch.test.mjs
      - name: Patches
        run: |
          i=1
          for f in chromium/patches/*.patch; do
            n=$(printf '%04d' $i)
            case "$(basename "$f")" in "$n"-*) ;; *) echo "out of order: $f"; exit 1 ;; esac
            head -1 "$f" | grep -q '^From 0000000000000000000000000000000000000000' || { echo "not a git patch: $f"; exit 1; }
            grep -q '^diff --git ' "$f" || { echo "empty patch: $f"; exit 1; }
            i=$((i+1))
          done
          echo "$((i-1)) patches"
          grep -Eq '^[0-9a-f]{40}$' chromium/CHROMIUM_REVISION
          grep -Eq '^[0-9]+\.0\.[0-9]+\.[0-9]+$' chromium/CHROMIUM_VERSION
