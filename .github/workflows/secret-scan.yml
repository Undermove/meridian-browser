name: Secret scan

# gitleaks (MIT, the CLI: no license key) over the commits of every PR and every push to main, and
# over the whole history weekly. On top of GitHub's own secret scanning and push protection, it
# catches generic keys and passwords that have no provider pattern. Values are redacted (--redact)
# in the log and in the SARIF, which goes to code scanning. Known synthetic test strings are
# allow-listed in .gitleaks.toml.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '47 4 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (checksum-pinned)
        run: |
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tgz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan
        id: scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # The commits this run is about: a PR's own, a push's new ones; the weekly run, everything.
          range=""
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push) [[ "$PUSH_BEFORE" =~ ^0+$ ]] || range="$PUSH_BEFORE..$GITHUB_SHA" ;;
          esac
          for sha in ${range/../ }; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Unexpected commit id" >&2; exit 1; }
          done
          echo "Scanning ${range:-the whole history}"
          args=(git --config .gitleaks.toml --redact --no-banner --exit-code 1
                --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif")
          [ -n "$range" ] && args+=(--log-opts "$range")
          "$RUNNER_TEMP/gitleaks" "${args[@]}" .
      - name: Upload to code scanning
        # A fork's PR gets no security-events: write; its log and exit code still tell.
        if: >-
          always() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: ${{ runner.temp }}/gitleaks.sarif
          category: gitleaks
