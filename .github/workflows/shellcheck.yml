name: ShellCheck

# Every shell script in the repository (git ls-files '*.sh'), with the settings in .shellcheckrc.
# Each finding is an annotation on its line (errors as errors, warnings as warnings, the rest as
# notices); only errors fail the job. A finding that is intended gets an inline
# "# shellcheck disable=SCxxxx" with the reason.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHELLCHECK_VERSION: 0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ShellCheck (checksum-pinned)
        run: |
          txz="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$txz" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$txz"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$txz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$txz" -C "$RUNNER_TEMP" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
      - name: ShellCheck
        run: |
          git ls-files -z '*.sh' | xargs -0 "$RUNNER_TEMP/shellcheck" -f json1 > "$RUNNER_TEMP/sc.json" || true
          jq -r '.comments[] |
            (if .level == "error" then "error" elif .level == "warning" then "warning" else "notice" end) as $t |
            "::\($t) file=\(.file),line=\(.line),endLine=\(.endLine),col=\(.column),title=SC\(.code)::\(.message)"' "$RUNNER_TEMP/sc.json"
          jq -r '"\(.comments | length) findings, \([.comments[] | select(.level == "error")] | length) errors"' "$RUNNER_TEMP/sc.json"
          [ "$(jq '[.comments[] | select(.level == "error")] | length' "$RUNNER_TEMP/sc.json")" = 0 ]
