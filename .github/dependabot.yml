# Dependabot for main (the only long-lived branch).
# - Security updates (repository setting, on) open right away, one PR per advisory, never grouped.
# - Version updates run weekly. Minor and patch bumps are grouped per ecosystem. Majors come one by one.
# - dependabot-automerge.yml merges patch/minor PRs once the required checks pass. Majors (and minor
#   bumps of 0.x packages, which may break) get the needs-review label.
version: 2
updates:
  - package-ecosystem: npm
    # Every folder with a package.json: the MCP bridge (root) and the Workbench's Monaco and xterm.
    directories: [/, /chromium/tools/workbench-vendor]
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        applies-to: version-updates
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/, /build/sandbox]
    schedule:
      interval: weekly
    groups:
      docker:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # The images stay on the Node LTS line; moving to the next LTS is a deliberate change.
      # Digest updates of node:22-* still come every week.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
