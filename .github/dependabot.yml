# Keeps the pinned GitHub Actions (pinned by commit SHA) up to date on both long-lived branches.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    target-branch: chromium-port
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
