# Weekly version updates for everything pinned in this repo, against main (the only long-lived branch).
# Security updates (from Dependabot alerts) come as their own PRs, outside this schedule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/, /build/sandbox]
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
