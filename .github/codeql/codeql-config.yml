# CodeQL reads only the code Meridian ships or runs for its users:
# - src/ (the Workbench page and its scripts, the MCP tool list, the Mission Control hook),
#   chromium/workbench (the page's bridge), mcp/ (the MCP bridge), site/ and docs/ (the website),
# - the Meridian WebUI TypeScript (sidebar, command bar, settings), rebuilt from chromium/patches
#   into chromium/webui-src by chromium/tools/extract_webui_sources.sh before the analysis,
# - .github (workflows, for the actions language).
# Left out: chromium/tests (E2E tests that build JS strings for CDP Runtime.evaluate and run local
# fixture servers) and chromium/tools (build, release and promo scripts run on the maintainer's
# machine). The C++ in the patches needs a full Chromium build to analyse, so CodeQL does not see it.
name: Meridian
paths-ignore:
  - chromium/tests
  - chromium/tools
  - '**/node_modules'
  - chromium/.vendor
