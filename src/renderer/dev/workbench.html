<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Internal page: local scripts only, no network. Monaco needs inline styles and blob: workers
       (which importScripts its local worker files); main additionally allowlists every URL this
       partition may load (src/dev/index.js). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Workbench</title>
  <link rel="stylesheet" href="../../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="workbench.css">
</head>
<body>
  <div id="wb">
    <header id="topbar">
      <button id="project-btn" class="chip" title="Switch project"><span class="ic-slot" data-icon="folder"></span><span id="project-name">No project</span><span class="ic-slot caret" data-icon="chevronDown"></span></button>
      <div class="grow"></div>
      <div id="launcher" role="toolbar" aria-label="Start an agent"></div>
      <div class="sep"></div>
      <form id="preview-form" title="Open your dev server next to the workbench">
        <span class="ic-slot" data-icon="globe"></span>
        <input id="preview-url" spellcheck="false" autocomplete="off" value="http://localhost:3000" aria-label="Preview URL">
        <button type="submit" class="btn small">Preview</button>
      </form>
    </header>

    <section id="welcome" hidden>
      <div class="welcome-card">
        <div class="logo"></div>
        <h1>Workbench</h1>
        <p class="muted">Open a project folder to edit files and run Claude Code, Codex, Gemini or a shell right next to your browser.</p>
        <button id="open-folder" class="btn accent big">Open folder…</button>
        <div id="recents"></div>
        <div id="welcome-agents"></div>
        <p id="terminal-error" class="warn" hidden></p>
      </div>
    </section>

    <section id="main" hidden>
      <aside id="tree-pane">
        <div class="pane-head">
          <span class="pane-title">Files</span>
          <div class="grow"></div>
          <button class="icon-btn small" id="tree-new-file" title="New file"><span class="ic-slot" data-icon="plus"></span></button>
          <button class="icon-btn small" id="tree-hidden" title="Show hidden folders (.git, node_modules)"><span class="ic-slot" data-icon="eye"></span></button>
          <button class="icon-btn small" id="tree-refresh" title="Refresh"><span class="ic-slot" data-icon="reload"></span></button>
        </div>
        <div id="tree" tabindex="0" role="tree"></div>
      </aside>
      <div class="v-grip" id="tree-grip"></div>
      <div id="center">
        <div id="editor-area">
          <div id="editor-tabs" role="tablist"></div>
          <div id="editor-banner" hidden></div>
          <div id="editor-host"></div>
          <div id="editor-empty">
            <div class="muted">Open a file from the tree</div>
            <div class="muted small keys"><kbd>⌘</kbd><kbd>S</kbd> save</div>
          </div>
          <div id="editor-placeholder" hidden></div>
        </div>
        <div class="h-grip" id="term-grip"></div>
        <div id="term-area">
          <div id="term-tabs" role="tablist">
            <div id="term-tab-list"></div>
            <button class="icon-btn small" id="term-new" title="New shell"><span class="ic-slot" data-icon="plus"></span></button>
            <div class="grow"></div>
            <button class="icon-btn small" id="term-toggle" title="Hide terminal"><span class="ic-slot" data-icon="chevronDown"></span></button>
          </div>
          <div id="term-host"></div>
          <div id="term-empty" class="muted">Start an agent or a shell from the toolbar above.</div>
        </div>
      </div>
    </section>

    <footer id="statusbar">
      <span id="browser-tools" class="status-chip"><span class="dot"></span><span class="label">Browser tools</span></span>
      <div class="grow"></div>
      <span id="status-file" class="muted"></span>
      <span id="status-pos" class="muted"></span>
    </footer>
  </div>

  <div id="popover" hidden></div>
  <div id="modal-overlay" hidden><div id="modal"></div></div>
  <div id="toasts"></div>

  <!-- xterm (UMD) must load before Monaco's AMD loader defines `define`. -->
  <script src="../../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../icons.js"></script>
  <script src="../../../node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="workbench.js"></script>
</body>
</html>
