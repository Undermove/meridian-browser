<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Meridian</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="chrome.css">
  <link rel="stylesheet" href="mission.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sb-top">
        <button class="icon-btn" data-cmd="toggle-sidebar" title="Toggle sidebar (⌘S)"></button>
        <div class="grow"></div>
        <button class="icon-btn" data-cmd="back" title="Back (⌘[)"></button>
        <button class="icon-btn" data-cmd="forward" title="Forward (⌘])"></button>
        <button class="icon-btn" data-cmd="reload" title="Reload (⌘R)"></button>
      </div>
      <button id="urlbar" title="Edit URL (⌘L)">
        <span class="lock"></span><span class="host"></span>
        <span class="url-actions">
          <span class="icon-btn small" data-cmd="copy-url" title="Copy URL (⇧⌘C)"></span>
        </span>
      </button>
      <div id="favorites"></div>
      <div id="space-scroller">
        <div id="space-pages"></div>
      </div>
      <div class="sb-bottom">
        <button class="icon-btn" id="btn-downloads" title="Downloads (⇧⌘J)"></button>
        <div id="space-dots"></div>
        <button class="icon-btn" id="btn-add-space" title="New space"></button>
      </div>
    </aside>
    <div id="edge-hotzone"></div>
    <main id="content">
      <div id="views"></div>
      <div id="split-handle"></div>
      <div id="load-error" hidden>
        <div class="err-title"></div>
        <div class="err-desc"></div>
        <button class="btn" id="err-retry">Try again</button>
      </div>
      <div id="empty-state">
        <div class="logo"></div>
        <div class="hint">Press <kbd>⌘</kbd><kbd>T</kbd> to search or open a site</div>
        <div class="empty-actions">
          <button class="empty-act" data-cmd="command-bar"><span class="ea-ic" data-icon="search"></span>New Tab<kbd class="keys-text">⌘T</kbd></button>
          <button class="empty-act" data-cmd="archive"><span class="ea-ic" data-icon="archive"></span>Archive<kbd class="keys-text">⌥⌘A</kbd></button>
          <button class="empty-act" data-cmd="ai-panel"><span class="ea-ic" data-icon="sparkles"></span>Ask AI<kbd class="keys-text">⌘J</kbd></button>
        </div>
      </div>
      <div id="findbar" hidden>
        <input id="find-input" placeholder="Find in page" spellcheck="false">
        <span id="find-count"></span>
        <button class="icon-btn small" id="find-prev"></button>
        <button class="icon-btn small" id="find-next"></button>
        <button class="icon-btn small" id="find-close"></button>
      </div>
    </main>
  </div>

  <div id="mini-bar">
    <div class="mini-traffic"></div>
    <button class="icon-btn" data-cmd="back"></button>
    <span class="mini-host"></span>
    <div class="grow"></div>
    <button class="btn accent" id="mini-promote">Open in Meridian</button>
  </div>

  <div id="peek" hidden>
    <div class="peek-card">
      <div class="peek-bar">
        <span class="peek-host"></span>
        <div class="grow"></div>
        <button class="icon-btn small" id="peek-split" title="Open in split view"></button>
        <button class="icon-btn small" id="peek-expand" title="Open as tab"></button>
        <button class="icon-btn small" id="peek-close" title="Close (Esc)"></button>
      </div>
      <div class="peek-body"></div>
    </div>
  </div>

  <div id="cmdbar-overlay" hidden>
    <div id="cmdbar">
      <div class="cmd-input-row">
        <span class="cmd-icon"></span>
        <input id="cmd-input" spellcheck="false" autocomplete="off" placeholder="Search or enter URL…">
      </div>
      <div id="cmd-results"></div>
      <div id="cmd-answer" hidden></div>
    </div>
  </div>

  <div id="modal-overlay" hidden><div id="modal"></div></div>
  <div id="toasts"></div>

  <script src="icons.js"></script>
  <script src="agent-access.js"></script>
  <script src="app.js"></script>
  <script src="dev/workbench-tab.js"></script>
  <script src="dev/secret-detect.js"></script><!-- Workbench Pro integration: secret check for the ⌘J input -->
  <script src="ai.js"></script>
  <script src="menu.js"></script>
  <script src="panels.js"></script>
  <script src="onboarding.js"></script>
  <script src="mission.js"></script><!-- Mission Control -->
  <script src="ai-max.js"></script><!-- Tidy Today, Ask Claude, link previews -->
</body>
</html>
