# gitleaks (.github/workflows/secret-scan.yml): the default rules plus the allow-lists below, each for
# strings known to be harmless. Findings already in history that fit no pattern are listed by
# fingerprint (commit:file:rule:line) in .gitleaksignore. Never allow-list a real key: revoke it.
[extend]
useDefault = true

# Synthetic keys planted by Meridian's secret-scrubber tests (Send a report, secret opt-out,
# SecretsTest): they spell out 0123456789 or say PLANTED / fake.
[[allowlists]]
description = "synthetic test keys"
regexTarget = "secret"
regexes = ['''0123456789''', '''(?i)planted|fake''']

# The Ed25519 release PUBLIC key install.sh checks signatures with (also built into Meridian).
[[allowlists]]
description = "release public key"
paths = ['''^docs/install\.sh$''']
regexTarget = "line"
regexes = ['''^\s*RELEASE_KEY(_DER)?="''']

# OpenCode session/message ids in the Context Insights test fixture (a sample opencode.db dump):
# 40 hex characters, which the Sourcegraph rule matches.
[[allowlists]]
description = "OpenCode fixture ids"
targetRules = ["sourcegraph-access-token"]
paths = ['''^chromium/patches/[0-9]{4}-Meridian-Context-Insights-[^/]*\.patch$''']
