<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Meridian Landing Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="../../docs/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0d; --panel: #171716; --line: #2a2a27; --text: #ecebe4; --muted: #8f8d83; --hot: #ffb224;
    color-scheme: dark;
    --display: "Bricolage Grotesque", sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 var(--mono); display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }

  .bar { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
  .mark { display: flex; align-items: center; gap: 10px; padding: 0 16px 0 max(16px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); font: 700 15px/1 var(--display); letter-spacing: -0.01em; white-space: nowrap; }
  .mark img { width: 20px; height: 20px; border-radius: 5px; }
  .mark em { font: 400 11px/1 var(--mono); color: var(--hot); font-style: normal; text-transform: uppercase; letter-spacing: 0.12em; }

  .concepts { display: flex; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .concepts::-webkit-scrollbar { display: none; }
  .concepts button { display: flex; align-items: baseline; gap: 8px; padding: 14px 16px 13px; border-right: 1px solid var(--line); white-space: nowrap; color: var(--muted); position: relative; }
  .concepts button b { font: 600 15px/1 var(--display); color: inherit; }
  .concepts button i { font-style: normal; font-size: 11px; opacity: 0.7; }
  .concepts button:hover { color: var(--text); }
  .concepts button[aria-pressed="true"] { color: var(--bg); background: var(--hot); }
  .concepts button[aria-pressed="true"] i { opacity: 0.75; }

  .tools { display: flex; align-items: center; gap: 2px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 10px; border-left: 1px solid var(--line); }
  .tools button, .tools a { padding: 7px 9px; border-radius: 6px; color: var(--muted); text-decoration: none; white-space: nowrap; }
  .tools button:hover, .tools a:hover { color: var(--text); background: #222220; }
  .tools button[aria-pressed="true"] { color: var(--text); background: #2c2c29; }
  .tools .sep { width: 1px; height: 18px; background: var(--line); margin: 0 6px; }

  .note { display: flex; gap: 18px; align-items: baseline; padding-block: 9px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); color: var(--muted); min-width: 0; }
  .note p { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .note p strong { color: var(--text); font-weight: 600; }
  .note kbd { font: inherit; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .note .keys { white-space: nowrap; }

  .stage { position: relative; min-height: 0; display: flex; justify-content: center; background:
    radial-gradient(circle at 1px 1px, #262623 1px, transparent 0) 0 0 / 18px 18px, var(--bg); }
  .frame { width: 100%; height: 100%; background: #fff; transition: width 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .stage.sized { padding: 18px 0; }
  .stage.sized .frame { border-radius: 14px; box-shadow: 0 0 0 1px var(--line), 0 30px 80px -20px #000; overflow: hidden; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .missing { position: absolute; inset: 0; display: none; place-items: center; text-align: center; color: var(--muted); background: var(--bg); }
  .missing.on { display: grid; }
  .missing b { display: block; font: 700 28px/1.1 var(--display); color: var(--text); margin-bottom: 8px; }

  @media (max-width: 860px) {
    .bar { flex-wrap: wrap; }
    .concepts { order: 3; flex-basis: 100%; border-top: 1px solid var(--line); }
    .tools { margin-left: auto; }
    .note .keys { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .frame { transition: none; } }
</style>
</head>
<body>

<div class="bar">
  <div class="mark"><img src="../../docs/icon.png" alt="">Landing lab <em>concepts</em></div>
  <div class="concepts" id="concepts" role="group" aria-label="Concept"></div>
  <div class="tools">
    <div id="sizes" role="group" aria-label="Viewport width"></div>
    <span class="sep"></span>
    <a id="open" target="_blank" rel="noopener" title="Open this concept alone in a new tab">Open ↗</a>
  </div>
</div>

<div class="note">
  <p id="note"></p>
  <span class="keys"><kbd>←</kbd> <kbd>→</kbd> concept · <kbd>0</kbd>–<kbd>5</kbd> jump · <kbd>W</kbd> width</span>
</div>

<div class="stage" id="stage">
  <div class="frame" id="frame"><iframe id="view" title="Concept preview"></iframe></div>
  <div class="missing" id="missing"><div><b>Not built yet</b>This concept's file isn't in <code>site/lab/</code>.</div></div>
</div>

<script>
(() => {
  const CONCEPTS = [
    { id: 'current', src: '../../docs/index.html', // build_artifact.py points this at current.html
      name: 'Current', note: 'The live page, for comparison. Built from site/pages/index.html.' },
    { id: '01-prime-meridian', name: 'Prime Meridian', note: 'The name, taken literally: a night chart strung on one line of light that draws itself as you scroll.' },
    { id: '02-the-window', name: 'The Window', note: 'The page is a Meridian window. Sections are tabs, spaces recolour it, the command bar works.' },
    { id: '03-moving-day', name: 'Moving Day', note: 'Print editorial: poster-scale type, a packing list of what comes over from Arc, screenshots as printed plates.' },
    { id: '04-spaces', name: 'Spaces', note: 'Every section is a space. Scrolling floods the screen with its colour while the window glides along.' },
    { id: '05-command', name: 'Command', note: 'One giant command bar on a dark stage. Type and the page answers.' },
  ];
  const SIZES = [{ w: 0, label: 'Full' }, { w: 1024, label: '1024' }, { w: 768, label: '768' }, { w: 390, label: '390' }];
  const $ = (s) => document.querySelector(s);
  const srcOf = (c) => c.src || `${c.id}.html`;

  let at = 0, size = 0;
  // The artifact host passes only a plain #name through, so the width stays out of the hash.
  const fromHash = () => Math.max(0, CONCEPTS.findIndex((c) => c.id === location.hash.slice(1)));
  at = fromHash();
  window.addEventListener('hashchange', () => { if (fromHash() !== at) { at = fromHash(); paint(true); } });

  CONCEPTS.forEach((c, i) => {
    const b = document.createElement('button');
    b.innerHTML = `<i>${i}</i><b>${c.name}</b>`;
    b.addEventListener('click', () => { at = i; paint(true); });
    $('#concepts').append(b);
  });
  SIZES.forEach((s, i) => {
    const b = document.createElement('button');
    b.textContent = s.label;
    b.addEventListener('click', () => { size = i; paint(false); });
    $('#sizes').append(b);
  });

  async function paint(reload) {
    const c = CONCEPTS[at], s = SIZES[size];
    [...$('#concepts').children].forEach((b, i) => {
      b.setAttribute('aria-pressed', i === at);
      if (i === at) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    });
    [...$('#sizes').children].forEach((b, i) => b.setAttribute('aria-pressed', i === size));
    $('#note').innerHTML = `<strong>${c.name}.</strong> ${c.note}`;
    $('#open').href = srcOf(c);
    $('#stage').classList.toggle('sized', s.w > 0);
    $('#frame').style.width = s.w ? `min(${s.w}px, 100%)` : '100%';
    if (location.hash.slice(1) !== c.id) history.replaceState(null, '', `#${c.id}`);
    if (!reload) return;
    let ok = true;
    try { ok = (await fetch(srcOf(c), { method: 'HEAD' })).ok; } catch { ok = false; }
    $('#missing').classList.toggle('on', !ok);
    $('#view').src = ok ? srcOf(c) : 'about:blank';
  }

  function onKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight') at = (at + 1) % CONCEPTS.length;
    else if (e.key === 'ArrowLeft') at = (at + CONCEPTS.length - 1) % CONCEPTS.length;
    else if (/^[0-5]$/.test(e.key)) at = +e.key;
    else if (e.key.toLowerCase() === 'w') { size = (size + 1) % SIZES.length; paint(false); return; }
    else return;
    paint(true);
  }
  window.addEventListener('keydown', onKey);

  paint(true);
})();
</script>
</body>
</html>
